<h2>Upcoming conferences ({{ conferences().length }})</h2>

<ul>
  @for (conference of conferences(); track conference.id) {
    <li>
      <button type="button" (click)="select(conference)">
        {{ conference.title }} — {{ conference.speaker }} · {{ conference.place }}
      </button>
      <button type="button" (click)="updateConference(conference)">Edit</button>
      <button type="button" (click)="deleteConference(conference)">Delete</button>
      <p>{{ conference.date | date }} · {{ placesLeft(conference) }} places left</p>
    </li>
  } 
  
</ul>

<app-conference-detail [conference]="selected()" />
